<!doctype html>
<meta charset="utf-8">
<title>nema story card, any agent</title>
<link rel="stylesheet" href="card.css">
<style>
  .card { padding: 92px 80px; }
  .fan { position: relative; width: 1440px; height: 500px; }
  .fan svg { position: absolute; inset: 0; }
  .tag {
    position: absolute; top: 0; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center;
    height: 86px; padding: 0 22px; box-sizing: border-box;
    border: 1px solid #1E3050; border-radius: 10px; background: #101B2D;
    font-size: 30px; color: #F2F6FF; white-space: nowrap;
  }
</style>

<div class="card card--yellow">
  <div class="fan">
    <svg width="1440" height="500" viewBox="0 0 1440 500" fill="none">
      <defs>
        <linearGradient id="ag-edge" x1="32" y1="4" x2="58" y2="34" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#15C4B4"/><stop offset="1" stop-color="#3A78FF"/>
        </linearGradient>
      </defs>
      <g stroke="#FFCA2E" stroke-width="4" stroke-linecap="round">
        <path d="M144 96 V 152 H 720 V 240"/>
        <path d="M432 96 V 192 H 720 V 240"/>
        <path d="M720 96 V 240"/>
        <path d="M1008 96 V 192 H 720 V 240"/>
        <path d="M1296 96 V 152 H 720 V 240"/>
      </g>
      <g transform="translate(592 240) scale(4)">
        <path d="M32 6 L54 19 L54 45 L32 58 L10 45 L10 19 Z" fill="#0B1320" stroke="url(#ag-edge)" stroke-width="1.6" stroke-linejoin="miter"/>
        <g shape-rendering="crispEdges">
          <rect x="29" y="3" width="6" height="6" fill="url(#ag-edge)"/>
          <rect x="51" y="16" width="6" height="6" fill="url(#ag-edge)"/>
          <rect x="51" y="42" width="6" height="6" fill="url(#ag-edge)"/>
          <rect x="29" y="55" width="6" height="6" fill="#FFCA2E"/>
          <rect x="7" y="42" width="6" height="6" fill="url(#ag-edge)"/>
          <rect x="7" y="16" width="6" height="6" fill="url(#ag-edge)"/>
        </g>
        <g fill="#F2F6FF" shape-rendering="crispEdges">
          <rect x="24" y="24" width="16" height="4"/><rect x="24" y="28" width="4" height="12"/><rect x="36" y="28" width="4" height="12"/>
        </g>
      </g>
    </svg>

    <span class="tag" style="left: 144px">ChatGPT desktop</span>
    <span class="tag" style="left: 432px">Chrome 149+</span>
    <span class="tag" style="left: 720px">Claude Code</span>
    <span class="tag" style="left: 1008px">Codex</span>
    <span class="tag" style="left: 1296px">nema extension</span>
  </div>
</div>
