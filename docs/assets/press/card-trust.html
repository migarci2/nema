<!doctype html>
<meta charset="utf-8">
<title>nema story card, three trust tiers</title>
<link rel="stylesheet" href="card.css">
<style>
  .card { padding: 96px 100px; }
  .r { display: flex; align-items: center; gap: 60px; padding: 46px 0; border-bottom: 1px solid #1E3050; }
  .r:first-child { border-top: 1px solid #1E3050; }
  .tier { width: 340px; flex: none; font-family: var(--font-mono), monospace; font-size: 46px; color: #F2F6FF; }
  .bar { flex: 1 1 auto; height: 22px; background: #16233A; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #00E5FF; }
  .w { width: 200px; flex: none; text-align: right; font-size: 34px; color: #9FB0CC; }
</style>

<div class="card">
  <h1 class="h">What a signature is worth</h1>

  <div class="r">
    <span class="tier">registered</span>
    <span class="bar"><i style="width:100%"></i></span>
    <span class="w">full</span>
  </div>
  <div class="r">
    <span class="tier">origin</span>
    <span class="bar"><i style="width:100%"></i></span>
    <span class="w">full</span>
  </div>
  <div class="r">
    <span class="tier">self</span>
    <span class="bar"><i style="width:30%"></i></span>
    <span class="w">capped</span>
  </div>
</div>
