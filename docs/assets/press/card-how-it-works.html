<!doctype html>
<meta charset="utf-8">
<title>nema story card, how it works</title>
<link rel="stylesheet" href="card.css">
<style>
  .row { display: flex; align-items: center; justify-content: center; }
  .item { width: 400px; flex: none; text-align: center; }
  .art { height: 400px; display: flex; align-items: center; justify-content: center; }
  .item .lbl { margin-top: 36px; font-size: 34px; color: #F2F6FF; }
  .arrow { width: 120px; flex: none; height: 400px; display: flex; align-items: center; justify-content: center; }
</style>

<div class="card">
  <div class="row">

    <div class="item">
      <div class="art">
        <svg width="300" height="360" viewBox="0 0 300 360" fill="none">
          <rect width="300" height="360" rx="14" fill="#EDE6D8"/>
          <g fill="#B9A688">
            <rect x="36" y="42" width="200" height="24" rx="6"/>
            <rect x="36" y="86" width="150" height="16" rx="5"/>
            <rect x="36" y="140" width="92" height="92" rx="6"/>
            <rect x="148" y="140" width="116" height="16" rx="5"/>
            <rect x="148" y="172" width="116" height="16" rx="5"/>
            <rect x="148" y="204" width="80" height="16" rx="5"/>
            <rect x="36" y="262" width="228" height="16" rx="5"/>
          </g>
          <rect x="0" y="340" width="300" height="20" fill="#00E5FF"/>
        </svg>
      </div>
      <p class="lbl">a site asks</p>
    </div>

    <div class="arrow">
      <svg width="100" height="34" viewBox="0 0 100 34" fill="none">
        <path d="M0 17 H78" stroke="#00E5FF" stroke-width="6"/>
        <path d="M66 5 L84 17 L66 29" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="item">
      <div class="art">
        <svg width="280" height="280" viewBox="0 0 64 64" fill="none">
          <defs>
            <linearGradient id="hw-edge" x1="32" y1="4" x2="58" y2="34" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#15C4B4"/><stop offset="1" stop-color="#3A78FF"/>
            </linearGradient>
          </defs>
          <path d="M32 6 L54 19 L54 45 L32 58 L10 45 L10 19 Z" fill="#101B2D" stroke="url(#hw-edge)" stroke-width="1.6" stroke-linejoin="miter"/>
          <g shape-rendering="crispEdges">
            <rect x="29" y="3" width="6" height="6" fill="url(#hw-edge)"/>
            <rect x="51" y="16" width="6" height="6" fill="url(#hw-edge)"/>
            <rect x="51" y="42" width="6" height="6" fill="url(#hw-edge)"/>
            <rect x="29" y="55" width="6" height="6" fill="#FFCA2E"/>
            <rect x="7" y="42" width="6" height="6" fill="url(#hw-edge)"/>
            <rect x="7" y="16" width="6" height="6" fill="url(#hw-edge)"/>
          </g>
          <g fill="#F2F6FF" shape-rendering="crispEdges">
            <rect x="24" y="24" width="16" height="4"/><rect x="24" y="28" width="4" height="12"/><rect x="36" y="28" width="4" height="12"/>
          </g>
        </svg>
      </div>
      <p class="lbl">you say yes</p>
    </div>

    <div class="arrow">
      <svg width="100" height="34" viewBox="0 0 100 34" fill="none">
        <path d="M0 17 H78" stroke="#00E5FF" stroke-width="6"/>
        <path d="M66 5 L84 17 L66 29" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="item">
      <div class="art">
        <svg width="300" height="360" viewBox="0 0 300 360" fill="none">
          <rect x="1" y="1" width="298" height="358" rx="14" fill="#101B2D" stroke="#1E3050" stroke-width="2"/>
          <g fill="#3E5273">
            <rect x="36" y="48" width="160" height="16" rx="5"/>
            <rect x="36" y="82" width="228" height="16" rx="5"/>
            <rect x="36" y="116" width="190" height="16" rx="5"/>
          </g>
          <rect x="36" y="168" width="228" height="2" fill="#1E3050"/>
          <circle cx="150" cy="252" r="46" fill="none" stroke="#00E5FF" stroke-width="7"/>
          <path d="M128 252 L144 270 L174 233" stroke="#00E5FF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="lbl">it counts next time</p>
    </div>

  </div>
</div>
