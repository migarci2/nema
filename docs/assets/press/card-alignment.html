<!doctype html>
<meta charset="utf-8">
<title>nema story card, concept alignment</title>
<link rel="stylesheet" href="card.css">
<style>
  .card { padding: 120px 80px; }
  .pair { display: flex; align-items: center; gap: 40px; }
  .side { flex: 1 1 0; min-width: 0; text-align: center; }
  .side .lbl { font-size: 30px; color: #9FB0CC; margin: 0 0 22px; }
  .word {
    display: flex; align-items: center; justify-content: center;
    height: 150px; box-sizing: border-box;
    border: 1px solid #1E3050; border-radius: 12px; background: #101B2D;
    font-size: 42px; white-space: nowrap;
  }
  .word--theirs { font-family: var(--font-mono), monospace; color: #F2F6FF; }
  .word--ours { color: #00E5FF; }

  .same { flex: none; width: 360px; text-align: center; padding-top: 86px; }
  .same p { font-size: 34px; color: #9FB0CC; margin: 0 0 26px; }
</style>

<div class="card">
  <div class="pair">
    <div class="side">
      <p class="lbl">site</p>
      <span class="word word--theirs">"browning science"</span>
    </div>

    <div class="same">
      <p>is the same thing as</p>
      <svg width="360" height="30" viewBox="0 0 360 30" fill="none">
        <rect x="30" y="11" width="300" height="8" fill="#00E5FF"/>
        <path d="M34 3 L14 15 L34 27 Z" fill="#00E5FF"/>
        <path d="M326 3 L346 15 L326 27 Z" fill="#00E5FF"/>
      </svg>
    </div>

    <div class="side">
      <p class="lbl">vault</p>
      <span class="word word--ours">Maillard reaction</span>
    </div>
  </div>
</div>
