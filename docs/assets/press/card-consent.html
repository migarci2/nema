<!doctype html>
<meta charset="utf-8">
<title>nema story card, the consent modal</title>
<link rel="stylesheet" href="card.css">
<style>
  .card { padding: 84px 80px; }
  .modal { border: 1px solid #1E3050; border-radius: 14px; background: #101B2D; }
  .modal__head { padding: 44px 52px 36px; }
  .modal__title { font-family: var(--font-display), monospace; font-size: 48px; font-weight: 400; margin: 0; letter-spacing: 0.01em; }

  .modal__body { padding: 12px 52px 20px; border-top: 1px solid #1E3050; }
  .r { display: flex; align-items: center; gap: 32px; padding: 26px 0; border-bottom: 1px solid #16233A; }
  .r:last-child { border-bottom: 0; }
  .r span:first-child { flex: 1 1 auto; font-size: 38px; }
  .pill { flex: none; display: inline-flex; align-items: center; gap: 14px;
          font-family: var(--font-mono), monospace; font-size: 32px; padding: 12px 24px; border-radius: 6px; }
  .pill::before { content: ""; width: 12px; height: 12px; background: currentColor; }
  .pill--v { color: #00E5FF; background: rgba(0, 229, 255, 0.12); }
  .pill--u { color: #A2CCFF; background: rgba(162, 204, 255, 0.14); }

  .modal__foot { display: flex; align-items: center; gap: 28px; padding: 36px 52px 44px; border-top: 1px solid #1E3050; }
  .btn { font-size: 36px; font-weight: 500; padding: 20px 46px; border-radius: 6px; }
  .btn--deny { color: #F2F6FF; border: 1px solid #2B3E60; }
  .btn--ok { color: #0B1320; background: #00E5FF; font-weight: 600; margin-left: auto; }
</style>

<div class="card">
  <div class="modal">
    <div class="modal__head">
      <h1 class="modal__title">Saucier School asks to know</h1>
    </div>

    <div class="modal__body">
      <div class="r"><span>Knife skills, apply</span><span class="pill pill--v">verified</span></div>
      <div class="r"><span>Heat control, explain</span><span class="pill pill--v">verified</span></div>
      <div class="r"><span>Cooking ratios, apply</span><span class="pill pill--u">uncertain</span></div>
    </div>

    <div class="modal__foot">
      <span class="btn btn--deny">Deny</span>
      <span class="btn btn--ok">Approve</span>
    </div>
  </div>
</div>
