<!doctype html>
<meta charset="utf-8">
<title>nema story card, the manifest and script install</title>
<link rel="stylesheet" href="card.css">
<style>
  .card { padding: 96px 80px; }
  .code {
    border: 1px solid #1E3050; border-radius: 14px; background: #101B2D;
    padding: 56px 56px 60px;
  }
  .code pre {
    margin: 0;
    font-family: var(--font-mono), monospace; font-size: 32px; line-height: 1.6;
    color: #9FB0CC; white-space: pre;
  }
  .p { color: #5E7095; }   /* brackets and punctuation */
  .t { color: #7BA4FF; }   /* tag name */
  .a { color: #A2CCFF; }   /* attribute name */
  .s { color: #15C4B4; }   /* the value you type */
  .k { color: #A2CCFF; }   /* json key */
</style>

<div class="card card--teal">
  <div class="code">
    <pre><span class="p">&lt;</span><span class="t">script</span> <span class="a">type</span><span class="p">=</span><span class="s">"application/nema+json"</span><span class="p">&gt;</span>
  <span class="p">{</span> <span class="k">"unit"</span><span class="p">:</span> ..., <span class="k">"activities"</span><span class="p">:</span> <span class="p">[</span>...<span class="p">]</span> <span class="p">}</span>
<span class="p">&lt;/</span><span class="t">script</span><span class="p">&gt;</span>

<span class="p">&lt;</span><span class="t">script</span> <span class="a">type</span><span class="p">=</span><span class="s">"module"</span>
        <span class="a">src</span><span class="p">=</span><span class="s">"https://nema.migarci2.dev/nema-provider.js"</span><span class="p">&gt;&lt;/</span><span class="t">script</span><span class="p">&gt;</span></pre>
  </div>
</div>
