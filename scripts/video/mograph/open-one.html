<meta charset="utf-8"><title>Every site starts from zero</title>
<link rel="stylesheet" href="film.css">
<div class="stage">
  <div id="line" class="kin" style="position:absolute;left:200px;top:452px;width:1560px;font-size:118px"></div>
  <div id="rule" style="position:absolute;left:200px;top:628px;height:4px;background:var(--cyan);width:0"></div>
</div>
<script type="module">
import { span, ease, words, kinetic } from './film.js';
/* One beat, one line. The three stock cuts that used to live here pushed the
 * first frame of the product past fifteen seconds, which is the one thing the
 * Devpost checklist asks for. */
const spans = words(document.getElementById('line'), 'Every site starts from zero.');
spans[spans.length - 1].style.color = 'var(--cyan)';
const rule = document.getElementById('rule');
window.renderAt = (t) => {
  kinetic(spans, t, { start: 0.06, stagger: 0.055, dur: 0.24 });
  rule.style.width = (ease(span(t, 0.34, 0.40)) * 320).toFixed(1) + 'px';
};
</script>
