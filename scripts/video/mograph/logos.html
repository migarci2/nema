<meta charset="utf-8"><title>any agent</title>
<link rel="stylesheet" href="film.css">
<style>
  .tile { position: absolute; width: 300px; height: 180px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; will-change: transform, opacity; }
  /* Every logo is painted, not drawn: the svg is a mask and the ink is ours,
     so a brand that ships a coloured file still lands at the same weight. */
  .icon { width: 64px; height: 64px; background: var(--ink); display: block;
    -webkit-mask-size: contain; -webkit-mask-position: center; -webkit-mask-repeat: no-repeat;
    mask-size: contain; mask-position: center; mask-repeat: no-repeat; }
  .glyph { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 27px; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 12px; letter-spacing: -0.02em; }
  .dot { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #43536F; display: flex;
    align-items: center; justify-content: center; }
  .dot i { width: 26px; height: 26px; border-radius: 50%; display: block; }
  .lab { font-size: 27px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .soon { font-family: 'JetBrains Mono', monospace; font-size: 19px; color: var(--yellow);
    letter-spacing: .14em; text-transform: uppercase; margin-top: -12px; }
  .rowtag { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 23px;
    letter-spacing: .2em; text-transform: uppercase; color: #4E6389; }
</style>
<div class="stage">
  <div id="grid"></div>
  <div id="markwrap" style="position:absolute;left:790px;top:300px;width:340px;height:340px;opacity:0"></div>
  <div id="line" class="kin" style="position:absolute;left:0;right:0;top:834px;text-align:center;font-size:72px"></div>
</div>
<script type="module">
import { span, ease, words, kinetic, fade } from './film.js';

const L = '../../../docs/assets/press/logos/';
const ROWS = [
  { tag: 'agents', y: 150, items: [
    { img: L + 'openai.svg', lab: 'ChatGPT' },
    { img: L + 'googlegemini.svg', lab: 'Gemini' },
    { img: L + 'claude.svg', lab: 'Claude' },
    { img: L + 'claude.svg', lab: 'Claude Code' },
    { glyph: '{ }', lab: 'Codex' }
  ] },
  { tag: 'the browser, the platform', y: 366, items: [
    { img: L + 'googlechrome.svg', lab: 'Chrome' },
    { img: L + 'firefoxbrowser.svg', lab: 'Firefox', soon: true },
    { img: L + 'safari.svg', lab: 'Safari', soon: true },
    { glyph: 'MCP', lab: 'WebMCP' },
    { img: L + 'cloudflare.svg', lab: 'Cloudflare Workers' }
  ] },
  { tag: 'and the sites', y: 582, items: [
    { dot: '#FF7429', lab: 'Saucier School' },
    { dot: '#4ADE80', lab: 'Line Cook Lab' },
    { dot: '#FFCA2E', lab: 'Maillard, an article' }
  ] }
];

const grid = document.getElementById('grid');
const tiles = [];
const rowTags = [];
ROWS.forEach((row, ri) => {
  const n = row.items.length;
  const left = (1920 - (n * 300 + (n - 1) * 24)) / 2;
  const tag = document.createElement('div');
  tag.className = 'rowtag';
  tag.textContent = row.tag;
  tag.style.left = left + 'px';
  tag.style.top = (row.y - 36) + 'px';
  grid.appendChild(tag);
  rowTags.push(tag);
  row.items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.left = (left + i * 324) + 'px';
    el.style.top = row.y + 'px';
    const art = it.img ? `<div class="icon" style="-webkit-mask-image:url(${it.img});mask-image:url(${it.img})"></div>`
      : it.glyph ? `<div class="glyph">${it.glyph}</div>`
      : `<div class="dot"><i style="background:${it.dot}"></i></div>`;
    el.innerHTML = art + `<div class="lab">${it.lab}</div>` + (it.soon ? '<div class="soon">soon</div>' : '');
    grid.appendChild(el);
    tiles.push({ el, cx: left + i * 324 + 150, cy: row.y + 86, soon: !!it.soon,
      order: ri * 5 + i, soonEl: el.querySelector('.soon') });
  });
});

document.getElementById('markwrap').innerHTML =
  `<svg viewBox="0 0 64 64" width="340" height="340"><defs>
    <linearGradient id="e" x1="32" y1="4" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#15C4B4"/><stop offset="1" stop-color="#3A78FF"/>
    </linearGradient></defs>
   <path d="M32 6 L54 19 L54 45 L32 58 L10 45 L10 19 Z" fill="none" stroke="url(#e)" stroke-width="2"/>
   <g shape-rendering="crispEdges">
     <rect x="29" y="3" width="6" height="6" fill="url(#e)"/><rect x="51" y="16" width="6" height="6" fill="url(#e)"/>
     <rect x="51" y="42" width="6" height="6" fill="url(#e)"/><rect x="29" y="55" width="6" height="6" fill="#FFCA2E"/>
     <rect x="7" y="42" width="6" height="6" fill="url(#e)"/><rect x="7" y="16" width="6" height="6" fill="url(#e)"/>
   </g>
   <g fill="#F2F6FF" shape-rendering="crispEdges">
     <rect x="24" y="24" width="16" height="4"/><rect x="24" y="28" width="4" height="12"/><rect x="36" y="28" width="4" height="12"/>
   </g></svg>`;

const markwrap = document.getElementById('markwrap');
const spans = words(document.getElementById('line'), 'Any agent. Any browser. Any site.');
const CX = 960, CY = 470;
const PULL_AT = 3.30, PULL_FOR = 0.80;

window.renderAt = (t) => {
  const pull = ease(span(t, PULL_AT, PULL_FOR));
  tiles.forEach((tile) => {
    const u = ease(span(t, 0.08 + tile.order * 0.06, 0.24));
    const dx = (CX - tile.cx) * pull, dy = (CY - tile.cy) * pull;
    const s = 1 - 0.72 * pull;
    tile.el.style.opacity = (u * (1 - pull)).toFixed(4);
    tile.el.style.transform = `translate(${dx.toFixed(1)}px, ${((1 - u) * 22 + dy).toFixed(1)}px) scale(${s.toFixed(4)})`;
    if (tile.soonEl) tile.soonEl.style.opacity = span(t, 2.0, 0.3).toFixed(3);
  });
  rowTags.forEach((tag, i) => fade(tag, span(t, 0.24 + i * 0.34, 0.28) * (1 - pull)));
  const m = ease(span(t, PULL_AT + 0.34, 0.5));
  markwrap.style.opacity = m.toFixed(3);
  markwrap.style.transform = `scale(${(0.55 + 0.45 * m).toFixed(4)})`;
  kinetic(spans, t, { start: PULL_AT + 0.72, stagger: 0.05, dur: 0.24 });
};
</script>
