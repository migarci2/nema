<meta charset="utf-8"><title>nema closing</title>
<link rel="stylesheet" href="film.css">
<style>
  .strip { position: absolute; left: 0; right: 0; top: 792px; display: flex; justify-content: center;
    align-items: center; gap: 44px; }
  .strip .icon { width: 46px; height: 46px; background: var(--ink); opacity: .82;
    -webkit-mask-size: contain; -webkit-mask-position: center; -webkit-mask-repeat: no-repeat;
    mask-size: contain; mask-position: center; mask-repeat: no-repeat; }
  .strip .g { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 21px; color: var(--ink);
    border: 2px solid #43536F; border-radius: 9px; padding: 9px 12px; opacity: .82; }
  .strip .sep { width: 2px; height: 40px; background: #1E2C42; }
</style>
<div class="stage">
  <div id="mark" style="position:absolute;left:784px;top:250px;width:352px;height:96px"></div>
  <div id="head" class="kin" style="position:absolute;left:0;right:0;top:412px;text-align:center;font-size:96px"></div>
  <div id="url" class="mono" style="position:absolute;left:0;right:0;top:582px;text-align:center;font-size:44px;color:var(--cyan)">nema.migarci2.dev</div>
  <div id="built" style="position:absolute;left:0;right:0;top:672px;text-align:center;font-size:32px;color:var(--ink-2);font-weight:500">Built for the WebMCP Challenge</div>
  <div class="strip" id="strip"></div>
  <div id="veil" style="position:absolute;inset:0;background:var(--navy);opacity:0"></div>
</div>
<script type="module">
import { span, words, kinetic, fade } from './film.js';
const L = '../../../docs/assets/press/logos/';
document.getElementById('strip').innerHTML =
  `<div class="g">MCP</div><div class="icon" style="-webkit-mask-image:url(${L}cloudflare.svg);mask-image:url(${L}cloudflare.svg)"></div><div class="sep"></div>` +
  [`${L}openai.svg`, `${L}googlechrome.svg`, `${L}googlegemini.svg`, `${L}claude.svg`]
    .map((s) => `<div class="icon" style="-webkit-mask-image:url(${s});mask-image:url(${s})"></div>`).join('') +
  `<div class="g">{ }</div>`;
document.getElementById('mark').innerHTML =
  `<svg viewBox="0 0 88 24" width="352" height="96" shape-rendering="crispEdges"><g fill="#F2F6FF">
   <rect x="0" y="0" width="16" height="4"/><rect x="0" y="4" width="4" height="20"/><rect x="12" y="4" width="4" height="20"/>
   <rect x="20" y="0" width="16" height="4"/><rect x="20" y="4" width="4" height="20"/><rect x="32" y="4" width="4" height="4"/>
   <rect x="20" y="8" width="16" height="4"/><rect x="20" y="20" width="16" height="4"/>
   <rect x="40" y="0" width="28" height="4"/><rect x="40" y="4" width="4" height="20"/><rect x="52" y="4" width="4" height="20"/><rect x="64" y="4" width="4" height="20"/>
   <rect x="72" y="0" width="16" height="4"/><rect x="84" y="4" width="4" height="20"/><rect x="72" y="8" width="16" height="4"/>
   <rect x="72" y="12" width="4" height="8"/><rect x="72" y="20" width="16" height="4"/></g></svg>`;
const spans = words(document.getElementById('head'), 'Learn it once. It counts everywhere.');
const mark = document.getElementById('mark'), url = document.getElementById('url');
const built = document.getElementById('built'), strip = document.getElementById('strip');
const veil = document.getElementById('veil');
window.renderAt = (t) => {
  fade(mark, span(t, 0.1, 0.3), 16);
  kinetic(spans, t, { start: 0.34, stagger: 0.045, dur: 0.24 });
  fade(url, span(t, 1.05, 0.3), 14);
  fade(built, span(t, 1.3, 0.3), 12);
  fade(strip, span(t, 1.55, 0.36), 10);
  /* Hold, then out to navy: the last thing the film does. */
  veil.style.opacity = span(t, 4.1, 0.85).toFixed(4);
};
</script>
