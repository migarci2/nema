<meta charset="utf-8"><title>starts from zero</title>
<link rel="stylesheet" href="film.css">
<div class="stage">
  <div id="line" class="kin" style="position:absolute;left:200px;top:470px;font-size:132px"></div>
</div>
<script type="module">
import { words, kinetic } from './film.js';
const spans = words(document.getElementById('line'), 'starts from zero.');
spans[2].style.color = 'var(--cyan)';
window.renderAt = (t) => kinetic(spans, t, { start: 0, stagger: 0.05, dur: 0.22 });
</script>
