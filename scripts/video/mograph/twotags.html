<meta charset="utf-8"><title>two tags</title>
<link rel="stylesheet" href="film.css">
<style>
  .code { position: absolute; left: 200px; top: 300px; width: 1520px;
    border: 2px solid #1E3050; border-radius: 20px; background: #101B2D; padding: 56px 60px 60px; }
  .code pre { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 34px; line-height: 1.62;
    color: #9FB0CC; white-space: pre; }
  .p { color: #5E7095; } .t { color: #7BA4FF; } .a { color: #A2CCFF; } .s { color: #15C4B4; } .k { color: #A2CCFF; }
  .caret { display: inline-block; width: 18px; height: 34px; background: var(--cyan); vertical-align: -6px; }
</style>
<div class="stage">
  <div id="kicker" class="kin" style="position:absolute;left:200px;top:180px;font-size:64px">One manifest block and one script tag.</div>
  <div class="code"><pre id="pre"></pre></div>
  <div id="foot" class="mono" style="position:absolute;left:200px;bottom:150px;font-size:32px;color:var(--ink-2)">Six WebMCP tools. No backend.</div>
</div>
<script type="module">
import { span, fade } from './film.js';
/* The snippet from docs/assets/press/card-one-tag.html, typed rather than cut
 * in: [class, text] pairs so the colour survives the reveal. */
const CODE = [
  ['p','&lt;'],['t','script'],['','&nbsp;'],['a','type'],['p','='],['s','"application/nema+json"'],['p','&gt;'],['','\n  '],
  ['p','{'],['','&nbsp;'],['k','"unit"'],['p',':'],['','&nbsp;...,&nbsp;'],['k','"activities"'],['p',':'],['','&nbsp;'],['p','[...]'],['','&nbsp;'],['p','}'],['','\n'],
  ['p','&lt;/'],['t','script'],['p','&gt;'],['','\n\n'],
  ['p','&lt;'],['t','script'],['','&nbsp;'],['a','type'],['p','='],['s','"module"'],['','\n        '],
  ['a','src'],['p','='],['s','"https://nema.migarci2.dev/nema-provider.js"'],['p','&gt;&lt;/'],['t','script'],['p','&gt;']
];
const flat = [];
for (const [cls, text] of CODE) {
  const tmp = document.createElement('span'); tmp.innerHTML = text;
  for (const ch of tmp.textContent) flat.push([cls, ch]);
}
const pre = document.getElementById('pre');
const kicker = document.getElementById('kicker');
const foot = document.getElementById('foot');
const TYPE_FROM = 0.36, TYPE_FOR = 1.62;
window.renderAt = (t) => {
  fade(kicker, span(t, 0.0, 0.24), 20);
  const u = span(t, TYPE_FROM, TYPE_FOR);
  const n = Math.round(u * flat.length);
  let html = '';
  let run = null;
  for (let i = 0; i < n; i++) {
    const [cls, ch] = flat[i];
    const safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
    if (run && run.cls === cls) run.text += safe;
    else { if (run) html += run.cls ? `<span class="${run.cls}">${run.text}</span>` : run.text; run = { cls, text: safe }; }
  }
  if (run) html += run.cls ? `<span class="${run.cls}">${run.text}</span>` : run.text;
  /* The caret blinks at 2 Hz while it is typing and goes away when it stops. */
  if (u < 1 && Math.floor(t * 4) % 2 === 0) html += '<span class="caret"></span>';
  pre.innerHTML = html;
  fade(foot, span(t, TYPE_FROM + TYPE_FOR + 0.12, 0.3), 14);
};
</script>
