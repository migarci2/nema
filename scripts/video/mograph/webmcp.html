<meta charset="utf-8"><title>The call, traced</title>
<link rel="stylesheet" href="film.css">
<style>
  .col { position: absolute; top: 340px; width: 660px; }
  .colhead { font-size: 34px; font-weight: 600; color: var(--ink); margin-bottom: 22px; }
  .colhead .sub { display: block; font-size: 24px; font-weight: 500; color: #4E6389; margin-top: 6px; }
  .card { border-radius: 14px; background: #111C2E; border: 2px solid #23334D;
    padding: 20px 26px; font-family: 'JetBrains Mono', monospace; font-size: 29px;
    color: var(--ink); white-space: nowrap; will-change: transform, opacity; }
  .card.said { border-color: #23445E; }
  .said-note { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 500; color: var(--ink-2); }
  .lane { position: absolute; left: 0; right: 0; top: 0; height: 1080px; }
</style>
<div class="stage">
  <div id="line" class="kin" style="position:absolute;left:160px;top:120px;width:1660px;font-size:62px"></div>

  <div class="col" id="colA" style="left:160px">
    <div class="colhead">Saucier School<span class="sub">the page you opened</span></div>
    <div class="card" id="c1">describe_learning_offer</div>
    <div style="height:210px"></div>
    <div class="card" id="c4">personalize_learning_path</div>
  </div>

  <div class="col" id="colB" style="left:1120px">
    <div class="colhead">your vault<span class="sub">where what you know is kept</span></div>
    <div style="height:110px"></div>
    <div class="card" id="c2">create_readiness_assertion</div>
    <div style="height:34px"></div>
    <div class="card said" id="c3"><span class="said-note">approved status words</span></div>
  </div>

  <svg class="lane" viewBox="0 0 1920 1080" fill="none" style="position:absolute;inset:0">
    <defs>
      <marker id="tip" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L10 6 L1 11" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="tipback" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L10 6 L1 11" fill="none" stroke="#15C4B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <path id="a1" d="M 826 475 L 1104 585" stroke="#00E5FF" stroke-width="3" marker-end="url(#tip)"/>
    <path id="a2" d="M 1104 694 L 826 760" stroke="#15C4B4" stroke-width="3" marker-end="url(#tipback)"/>
  </svg>
</div>
<script type="module">
import { span, ease, easeInOut, words, kinetic, fade } from './film.js';
/* One call, drawn: the page asks what it teaches, the vault is asked for a
 * readiness assertion, the vault answers in status words, and the page
 * personalises itself. No tokens on screen, because none of that is the point. */
const spans = words(document.getElementById('line'), 'Your agent connects it all with WebMCP.');
spans[spans.length - 1].style.color = 'var(--cyan)';
const colA = document.getElementById('colA'), colB = document.getElementById('colB');
const cards = ['c1', 'c2', 'c3', 'c4'].map((id) => document.getElementById(id));
const arrows = ['a1', 'a2'].map((id) => document.getElementById(id));
const lens = arrows.map((a) => a.getTotalLength());
arrows.forEach((a, i) => { a.style.strokeDasharray = lens[i]; });
const AT = [1.05, 2.15, 3.25, 4.35];
const ARROW_AT = [1.70, 3.85];

window.renderAt = (t) => {
  kinetic(spans, t, { start: 0.06, stagger: 0.05, dur: 0.24 });
  fade(colA, ease(span(t, 0.60, 0.30)), 14);
  fade(colB, ease(span(t, 0.75, 0.30)), 14);
  cards.forEach((el, i) => {
    const u = ease(span(t, AT[i], 0.30));
    el.style.opacity = u.toFixed(3);
    el.style.transform = `translateY(${((1 - u) * 16).toFixed(1)}px)`;
  });
  arrows.forEach((a, i) => {
    const u = easeInOut(span(t, ARROW_AT[i], 0.55));
    a.style.strokeDashoffset = (lens[i] * (1 - u)).toFixed(1);
    a.style.opacity = (u > 0.001 ? 1 : 0).toFixed(2);
  });
};
</script>
