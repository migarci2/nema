<meta charset="utf-8"><title>nema title</title>
<link rel="stylesheet" href="film.css">
<style>
  /* The composition is the approved thumbnail, docs/assets/devpost-thumbnail.html,
     laid out at its own 1800x1200 and scaled to the film's 1920 wide frame. The
     100 px trimmed off the top and the bottom carry nothing. */
  #fit { position: absolute; left: 0; top: -100px; width: 1920px; height: 1280px; }
  #art { width: 1800px; height: 1200px; transform: scale(1.0666667); transform-origin: 0 0; position: relative; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0B1320 0%, #0B1320 42%, rgba(11,19,32,0.82) 56%, rgba(11,19,32,0) 70%); }
  .word { position: absolute; left: 120px; top: 310px; width: 760px; color: #F2F6FF; }
  .word svg { width: 100%; height: auto; display: block; }
  .sub { position: absolute; left: 120px; top: 590px; font-size: 72px; line-height: 1.2; font-weight: 600; white-space: nowrap; }
  .sub .t { color: #15C4B4; } .sub .v { color: #00E5FF; } .sub .a { color: #FFCA2E; }
  .head { position: absolute; left: 120px; top: 590px; font-size: 72px; line-height: 1.2; font-weight: 600;
    color: #F2F6FF; white-space: nowrap; letter-spacing: -0.015em; }
</style>
<div class="stage"><div id="fit"><div id="art">
  <svg class="diagram" viewBox="0 0 1800 1200" width="1800" height="1200" fill="none" style="position:absolute;inset:0">
    <defs>
      <linearGradient id="edge" x1="1355" y1="420" x2="1500" y2="580" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#15C4B4"/><stop offset="1" stop-color="#3A78FF"/>
      </linearGradient>
    </defs>
    <g transform="translate(-480 86) scale(1.3)">
      <g class="site" id="site0">
        <rect x="1010" y="100" width="200" height="250" rx="10" fill="#EDE6D8"/>
        <g fill="#B9A688"><rect x="1034" y="128" width="150" height="18" rx="4"/><rect x="1034" y="160" width="120" height="12" rx="3"/><rect x="1034" y="196" width="64" height="64" rx="4"/><rect x="1110" y="196" width="76" height="12" rx="3"/><rect x="1110" y="220" width="76" height="12" rx="3"/><rect x="1110" y="244" width="76" height="12" rx="3"/><rect x="1034" y="282" width="152" height="12" rx="3"/><rect x="1034" y="306" width="120" height="12" rx="3"/></g>
      </g>
      <g class="site" id="site1">
        <rect x="1250" y="120" width="210" height="200" rx="10" fill="#101216" stroke="#2A2F3A" stroke-width="2"/>
        <g fill="#4ADE80"><rect x="1276" y="150" width="96" height="12" rx="3"/><rect x="1276" y="172" width="120" height="12" rx="3"/><rect x="1276" y="194" width="150" height="12" rx="3"/><rect x="1276" y="216" width="80" height="12" rx="3"/><rect x="1276" y="238" width="130" height="12" rx="3"/><rect x="1276" y="260" width="160" height="12" rx="3"/><rect x="1276" y="282" width="90" height="12" rx="3"/></g>
      </g>
      <g class="site" id="site2">
        <rect x="1500" y="110" width="200" height="240" rx="10" fill="#FAFAFA"/>
        <g fill="#C6C6C6"><rect x="1524" y="140" width="152" height="18" rx="4"/><rect x="1524" y="172" width="90" height="12" rx="3"/><rect x="1524" y="208" width="152" height="12" rx="3"/><rect x="1524" y="232" width="152" height="12" rx="3"/><rect x="1524" y="256" width="152" height="12" rx="3"/><rect x="1524" y="292" width="70" height="12" rx="3"/><rect x="1606" y="292" width="70" height="12" rx="3"/><rect x="1524" y="316" width="120" height="12" rx="3"/></g>
      </g>
      <g id="wires" stroke="#00E5FF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M 1110 350 V 395 L 1245 485"/>
        <path d="M 1355 320 V 420"/>
        <path d="M 1600 350 V 395 L 1465 485"/>
      </g>
      <g id="pulses"></g>
      <g id="mark" transform="translate(1195 390) scale(5)">
        <path id="hex" d="M32 6 L54 19 L54 45 L32 58 L10 45 L10 19 Z" fill="#0B1320" stroke="url(#edge)" stroke-width="0.8" stroke-linejoin="miter"/>
        <g id="nodes" shape-rendering="crispEdges">
          <rect x="29" y="3" width="6" height="6" fill="url(#edge)"/>
          <rect x="51" y="16" width="6" height="6" fill="url(#edge)"/>
          <rect x="51" y="42" width="6" height="6" fill="url(#edge)"/>
          <rect x="29" y="55" width="6" height="6" fill="#FFCA2E"/>
          <rect x="7" y="42" width="6" height="6" fill="url(#edge)"/>
          <rect x="7" y="16" width="6" height="6" fill="url(#edge)"/>
        </g>
        <g fill="#F2F6FF" shape-rendering="crispEdges">
          <rect x="24" y="24" width="16" height="4"/><rect x="24" y="28" width="4" height="12"/><rect x="36" y="28" width="4" height="12"/>
        </g>
      </g>
    </g>
  </svg>
  <div class="fade"></div>
  <div class="word"><svg viewBox="0 0 88 24" shape-rendering="crispEdges"><g fill="#F2F6FF">
    <rect x="0" y="0" width="16" height="4"/><rect x="0" y="4" width="4" height="20"/><rect x="12" y="4" width="4" height="20"/>
    <rect x="20" y="0" width="16" height="4"/><rect x="20" y="4" width="4" height="20"/><rect x="32" y="4" width="4" height="4"/>
    <rect x="20" y="8" width="16" height="4"/><rect x="20" y="20" width="16" height="4"/>
    <rect x="40" y="0" width="28" height="4"/><rect x="40" y="4" width="4" height="20"/><rect x="52" y="4" width="4" height="20"/><rect x="64" y="4" width="4" height="20"/>
    <rect x="72" y="0" width="16" height="4"/><rect x="84" y="4" width="4" height="20"/><rect x="72" y="8" width="16" height="4"/>
    <rect x="72" y="12" width="4" height="8"/><rect x="72" y="20" width="16" height="4"/></g></svg></div>
  <div class="sub" id="sub"><span class="t">The web teaches</span><br><span class="v">Your vault remembers</span><br><span class="a">Your agent connects the two</span></div>
  <div class="head" id="head" style="opacity:0">Learn it once.<br>It counts everywhere.</div>
</div></div></div>
<script type="module">
import { span, ease, easeInOut } from './film.js';

const svgns = 'http://www.w3.org/2000/svg';
const sites = [0, 1, 2].map((i) => document.getElementById('site' + i));
const wires = [...document.getElementById('wires').children];
const lens = wires.map((w) => w.getTotalLength());
wires.forEach((w, i) => { w.style.strokeDasharray = lens[i]; });
const pulses = wires.map(() => {
  const c = document.createElementNS(svgns, 'circle');
  c.setAttribute('r', '7'); c.setAttribute('fill', '#FFCA2E');
  document.getElementById('pulses').appendChild(c);
  return c;
});
const mark = document.getElementById('mark');
const hex = document.getElementById('hex');
const nodes = [...document.getElementById('nodes').children];
/* Round the hexagon, then the five gradient nodes, and the yellow one last:
   a learner is never finished, so that node is where the sequence lands. */
const NODE_ORDER = [0, 1, 2, 4, 5, 3];
const sub = document.getElementById('sub');
const head = document.getElementById('head');

const SITE_AT = 0.10, SITE_STAGGER = 0.06, SITE_FOR = 0.44;
const WIRE_AT = 0.62, WIRE_STAGGER = 0.06, WIRE_FOR = 0.60;
const HEX_AT = 1.14, NODE_AT = 1.38, NODE_STEP = 0.075, NODE_FOR = 0.22;
const PULSE_AT = 1.98, PULSE_STAGGER = 0.06, PULSE_FOR = 0.62;
const BEAT_AT = 2.62, SWAP_AT = 2.66;

window.renderAt = (t) => {
  /* The pages settle in from a little above, one after another. */
  sites.forEach((el, i) => {
    const u = ease(span(t, SITE_AT + i * SITE_STAGGER, SITE_FOR));
    el.style.opacity = u.toFixed(4);
    el.style.transform = `translateY(${((1 - u) * -34).toFixed(2)}px)`;
  });
  /* The lines draw downward, into the mark. */
  wires.forEach((w, i) => {
    const u = easeInOut(span(t, WIRE_AT + i * WIRE_STAGGER, WIRE_FOR));
    w.style.strokeDashoffset = (lens[i] * (1 - u)).toFixed(1);
  });
  const hexU = ease(span(t, HEX_AT, 0.40));
  hex.style.opacity = hexU.toFixed(4);
  nodes.forEach((n, i) => {
    const order = NODE_ORDER.indexOf(i);
    n.style.opacity = ease(span(t, NODE_AT + order * NODE_STEP, NODE_FOR)).toFixed(4);
  });
  /* One yellow receipt down each line, once. */
  pulses.forEach((c, i) => {
    const u = span(t, PULSE_AT + i * PULSE_STAGGER, PULSE_FOR);
    const p = wires[i].getPointAtLength(lens[i] * easeInOut(u));
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
    c.style.opacity = (u > 0.001 && u < 0.999 ? 1 : 0).toFixed(2);
  });
  /* The mark takes one breath as the last receipt lands. */
  const beat = span(t, BEAT_AT, 0.42);
  const pulse = Math.sin(Math.PI * ease(beat)) * 0.045;
  mark.setAttribute('transform', `translate(1195 390) scale(${(5 * (0.965 + 0.035 * hexU + pulse)).toFixed(4)})`);
  /* The thesis hands over to the headline. */
  const outU = ease(span(t, SWAP_AT, 0.30));
  const inU = ease(span(t, SWAP_AT + 0.18, 0.34));
  sub.style.opacity = (1 - outU).toFixed(4);
  sub.style.transform = `translateY(${(outU * -22).toFixed(2)}px)`;
  head.style.opacity = inU.toFixed(4);
  head.style.transform = `translateY(${((1 - inU) * 24).toFixed(2)}px)`;
};
</script>
