<meta charset="utf-8"><title>on camera slot</title>
<link rel="stylesheet" href="film.css">
<style>
  .row { position: relative; display: flex; align-items: baseline; gap: 28px; margin-bottom: 26px;
    will-change: transform, opacity; }
  .who { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--cyan);
    width: 46px; flex: 0 0 46px; text-align: right; }
  .said { font-weight: 600; letter-spacing: -0.018em; line-height: 1.16; color: var(--ink); }
</style>
<div class="stage">
  <div style="position:absolute;left:160px;top:150px;width:110px;height:110px;border-left:4px solid var(--cyan);border-top:4px solid var(--cyan);opacity:.45"></div>
  <div style="position:absolute;right:160px;bottom:150px;width:110px;height:110px;border-right:4px solid var(--cyan);border-bottom:4px solid var(--cyan);opacity:.45"></div>
  <div id="tag" class="mono" style="position:absolute;left:264px;top:242px;font-size:29px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase"></div>
  <div id="rows" style="position:absolute;left:264px;top:330px;width:1400px"></div>
  <div id="meta" class="mono" style="position:absolute;left:264px;bottom:262px;font-size:26px;color:var(--ink-2)"></div>
  <div style="position:absolute;left:264px;bottom:230px;width:1392px;height:2px;background:var(--line)"></div>
  <div id="bar" style="position:absolute;left:264px;bottom:230px;height:2px;background:var(--cyan);width:0"></div>
</div>
<script type="module">
import { span, ease, fade } from './film.js';
const q = new URLSearchParams(location.search);
const slot = q.get('slot') || 'B';
const secs = Number(q.get('secs') || 4);
/* "M|line~~C|line". Two people talking, so the placeholder shows the shape of
 * the exchange and not just a sentence. */
const lines = (q.get('lines') || '').split('~~').filter(Boolean).map((s) => {
  const at = s.indexOf('|');
  return { who: s.slice(0, at), said: s.slice(at + 1) };
});
document.getElementById('tag').textContent = `on camera / slot ${slot}`;
document.getElementById('meta').textContent =
  `placeholder. drop the filmed take here. ${secs.toFixed(1)} s, hard cut in and out.`;
const size = lines.length >= 5 ? 46 : lines.length >= 4 ? 52 : lines.length >= 3 ? 60 : 72;
const rows = document.getElementById('rows');
const els = lines.map((l) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.fontSize = size + 'px';
  row.innerHTML = `<span class="who">${l.who}</span><span class="said">${l.said.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`;
  rows.appendChild(row);
  return row;
});
const tag = document.getElementById('tag'), meta = document.getElementById('meta'), bar = document.getElementById('bar');
window.renderAt = (t) => {
  fade(tag, span(t, 0.05, 0.24));
  els.forEach((el, i) => {
    const u = ease(span(t, 0.18 + i * 0.14, 0.24));
    el.style.opacity = u.toFixed(4);
    el.style.transform = `translateY(${((1 - u) * 22).toFixed(2)}px)`;
  });
  fade(meta, span(t, 0.5, 0.3));
  bar.style.width = (1392 * Math.min(1, t / secs)).toFixed(1) + 'px';
};
</script>
