<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your vault</title>
<meta name="description" content="The vault window a site opens to ask what you already know, or to hand you a receipt. You decide here, in your own vault, on your own origin.">
<link rel="icon" href="/shared/brand/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/shared/brand/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/brand/tokens.css">
<link rel="stylesheet" href="/shared/brand/brand.css">
<link rel="stylesheet" href="/app.css">
<style>
  /* A popup is 480 by 720 and holds one question. Everything the full vault
     draws (graph, ledgers, needs, tools) is deliberately absent. */
  body { min-height: 100vh; }
  .c-connect {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    padding: var(--sp-5) var(--sp-4);
    max-width: 460px;
    margin: 0 auto;
  }
  .c-connect__head { display: flex; align-items: center; gap: var(--sp-2); }
  .c-connect__mark { display: block; width: 22px; height: 22px; color: var(--ink); }
  .c-connect__mark svg { display: block; width: 100%; height: 100%; }
  .c-connect__brand {
    font-family: var(--font-display);
    font-size: var(--fs-16);
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .c-connect__body { flex: 1; display: flex; flex-direction: column; gap: var(--sp-3); }
  .c-connect__title {
    font-size: var(--fs-20);
    line-height: var(--lh-tight);
    font-weight: 600;
    color: var(--ink);
    margin: 0;
  }
  .c-connect__line { font-size: var(--fs-13); color: var(--ink-2); margin: 0; }
  .c-connect__origin {
    font-family: var(--font-mono);
    font-size: var(--fs-12);
    color: var(--ink-3);
    overflow-wrap: anywhere;
    margin: 0;
  }
  .c-connect__moved {
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    padding-left: var(--sp-3);
    border-left: 2px solid var(--cyan-24);
    font-size: var(--fs-13);
    color: var(--ink-2);
  }
  .c-connect__foot {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    font-size: var(--fs-12);
    color: var(--ink-3);
  }
  .c-connect__line[data-kind='bad'] { color: var(--danger); }
  /* In a popup the modal is the page: no backdrop, no centring dance, and the
     window scrolls rather than the dialog, so nothing in the question can hide
     below a fold the reader cannot see. */
  .c-connect .n-modal { position: static; padding: 0; background: none; }
  .c-connect .n-modal__dialog {
    max-width: none;
    width: 100%;
    max-height: none;
    overflow: visible;
  }
  .c-connect .n-modal__foot { position: static; }
</style>
<script src="/shared/webmcp-polyfill.js"></script>
</head>
<body>

<div class="c-connect">

  <header class="c-connect__head">
    <span class="c-connect__mark" data-nema-mark aria-hidden="true"></span>
    <span class="c-connect__brand">nema vault</span>
  </header>

  <main class="c-connect__body">
    <h1 class="c-connect__title" data-connect-title>Connect your vault</h1>
    <p class="c-connect__line" data-connect-line role="status" aria-live="polite">Reading the request.</p>
    <p class="c-connect__origin" data-connect-origin hidden></p>
    <div class="c-connect__moved" data-connect-moved hidden></div>

    <!-- The consent modal, the same markup and the same hooks as the vault
         page, because it has to be the same question every time. -->
    <div class="n-modal" id="consent-modal" role="dialog" aria-modal="true" aria-labelledby="consent-title" aria-describedby="consent-purpose" hidden>
      <div class="n-modal__dialog" tabindex="-1">
        <div class="n-modal__head">
          <h2 class="n-modal__title" id="consent-title" data-consent-title>A site asks to know</h2>
          <p class="v-consent__origin mono" data-consent-origin></p>
          <p class="v-consent__purpose" id="consent-purpose" data-consent-purpose></p>
        </div>
        <div class="n-modal__body">
          <div class="v-consent__block">
            <span class="v-sublabel">Shared</span>
            <div class="n-ledger" data-consent-shared></div>
          </div>
          <div class="v-consent__block">
            <span class="v-sublabel">Not shared</span>
            <ul class="v-consent__withheld" data-consent-withheld></ul>
          </div>
        </div>
        <div class="n-modal__foot v-consent__foot">
          <div class="v-consent__decide">
            <p class="v-consent__expiry" data-consent-expiry>Expires in 30 minutes</p>
            <label class="n-check">
              <input type="checkbox" data-consent-auto>
              <span>Auto approve this site for 1 hour</span>
            </label>
          </div>
          <button class="n-btn n-btn--secondary" type="button" data-consent-deny>Deny</button>
          <span class="v-consent__timer mono" data-consent-timer aria-hidden="true"></span>
          <button class="n-btn n-btn--primary" type="button" data-consent-approve>Approve</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="c-connect__foot">
    <span data-connect-note>Your vault runs here, in your browser, on its own origin.</span>
    <a class="v-text-btn" href="/" data-connect-back hidden>Back to the vault</a>
  </footer>

</div>

<script type="module" src="/connect.js"></script>
</body>
</html>
