<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Cook Lab: Service Under Pressure</title>
<meta name="description" content="Service Under Pressure: a short kitchen unit on food safety during service, with deterministic labs and signed evidence receipts.">
<link rel="icon" href="/shared/brand/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/shared/brand/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/brand/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/brand/tokens.css">
<link rel="stylesheet" href="/shared/brand/brand.css">
<link rel="stylesheet" href="/app.css">
<script src="/shared/webmcp-polyfill.js"></script>
</head>
<body>
<a class="skip-link" href="#unit">Skip to the unit</a>

<div class="n-app">
  <header data-nema-header></header>

  <main class="n-app__main" id="unit">

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__lead">
        <h1 class="hero__title" id="hero-title">Service Under Pressure</h1>
        <p class="hero__blurb">
          Find the steps in a service log that break a food safety rule, then make the call
          on four incidents during a live pass.
        </p>
        <p class="hero__facts" data-hero-stats></p>
        <p class="hero__note" data-hero-note hidden></p>
      </div>

      <section class="reqs" aria-labelledby="reqs-title">
        <h2 class="reqs__title" id="reqs-title">
          Requirements
          <span class="n-panel__hint" data-prereq-hint></span>
        </h2>
        <ul class="reqs__list" data-hero-requirements></ul>
        <div class="reqs__body" data-prereq-body></div>
      </section>
    </section>

    <section class="sec" aria-labelledby="path-title">
      <h2 class="n-panel__label" id="path-title">
        Activities
        <span class="n-panel__hint" data-path-hint></span>
      </h2>
      <div data-path-body></div>
    </section>

    <section class="sec" aria-labelledby="stage-title" data-stage-panel>
      <h2 class="n-panel__label" id="stage-title">
        Activity stage
        <span class="n-panel__hint" data-stage-hint></span>
      </h2>
      <p class="sr-only" data-live-region role="status" aria-live="polite"></p>
      <div data-stage-body></div>
    </section>

    <section class="sec" aria-labelledby="receipt-title" data-receipt-panel>
      <h2 class="n-panel__label" id="receipt-title">
        Evidence receipt
        <span class="n-panel__hint" data-receipt-hint></span>
      </h2>
      <div data-receipt-body></div>
    </section>

    <section class="sec sec--strip" aria-labelledby="tools-title">
      <span class="strip__head" id="tools-title">Tool activity</span>
      <div data-activity-strip></div>
    </section>

    <details class="more">
      <summary class="more__summary">More</summary>
      <div class="more__body">
        <div data-prereq-meta></div>
        <p class="more__origin" data-hero-origin></p>
        <p><button type="button" class="text-action" data-action="reset">Reset this unit</button></p>
      </div>
    </details>

  </main>

  <footer data-nema-footer></footer>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
